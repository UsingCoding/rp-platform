services:
  gateway:
    image: ghcr.io/distributed-programming-2026/gateway:v0.0.1
    platform: linux/amd64
    environment:
      LOCAL_GATEWAY_CONFIG_HASH: ${LOCAL_GATEWAY_CONFIG_HASH:-}
    ports:
      - "${LOCAL_GATEWAY_PORT:-80}:80"
      - "${LOCAL_GATEWAY_HEALTH_PORT:-15000}:15000"
    volumes:
      - ./dist/local/gateway:/config:ro

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root
    ports:
      - "${LOCAL_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - mysql-data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: local
    ports:
      - "${LOCAL_AMQP_PORT:-5672}:5672"
      - "${LOCAL_AMQP_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    environment:
      SQL_PASSWORD: local-root
    entrypoint: ["sh", "-euc"]
    command:
      - |
        for db in temporal temporal_visibility; do
          schema=$${db#temporal_}
          sql="temporal-sql-tool --plugin mysql8 --ep mysql -p 3306 -u root --db $$db"
          $$sql create
          $$sql setup-schema -v 0.0
          $$sql update-schema -d /etc/temporal/schema/mysql/v8/$$schema/versioned
        done
    depends_on:
      mysql:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.32.2
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: root
      MYSQL_PWD: local-root
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${LOCAL_TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 60
    depends_on:
      temporal-schema:
        condition: service_completed_successfully

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["sh", "-euc"]
    command:
      - |
        until temporal operator cluster health; do sleep 2; done
        temporal operator namespace describe -n default >/dev/null 2>&1 ||
          temporal operator namespace create -n default
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.58.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${LOCAL_TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully

volumes:
  mysql-data:
  rabbitmq-data:
