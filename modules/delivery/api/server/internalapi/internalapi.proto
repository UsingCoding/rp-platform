syntax = "proto3";
package deliveryInternalAPI;

option go_package = "/.;deliveryinternalapi";

service DeliveryService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc ScheduleDelivery(ScheduleDeliveryRequest) returns (ScheduleDeliveryResponse);
  rpc CancelDelivery(CancelDeliveryRequest) returns (CancelDeliveryResponse);
}

message EchoRequest {
  string Body = 1;
}

message EchoResponse {
  string OperationID = 1;
}

message ScheduleDeliveryRequest {
  string OrderID = 1;
  string Address = 2;
  ChaosError Error = 3;
}

message ScheduleDeliveryResponse {
}

message CancelDeliveryRequest {
  string OrderID = 1;
  ChaosError Error = 2;
}

message CancelDeliveryResponse {
}

// ChaosError makes the service fail the method named in MethodError.
message ChaosError {
  string MethodError = 1;
}
