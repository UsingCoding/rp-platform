syntax = "proto3";
package paymentInternalAPI;

option go_package = "/.;paymentinternalapi";

service PaymentService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc ChargePayment(ChargePaymentRequest) returns (ChargePaymentResponse);
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);
}

message EchoRequest {
  string Body = 1;
}

message EchoResponse {
  string OperationID = 1;
}

message ChargePaymentRequest {
  string OrderID = 1;
  int64 Amount = 2;
  ChaosError Error = 3;
}

message ChargePaymentResponse {
}

message RefundPaymentRequest {
  string OrderID = 1;
  ChaosError Error = 2;
}

message RefundPaymentResponse {
}

// ChaosError makes the service fail the method named in MethodError
// and delay the methods listed in MethodSleep.
message ChaosError {
  string MethodError = 1;
  repeated string MethodSleep = 2;
}
