services:
  payment-service:
    image: distributed-programming-payment:local
    build:
      context: ./modules/payment
      dockerfile: Dockerfile
    environment:
      PAYMENT_MYSQL_ADDRESS: mysql:3306
      PAYMENT_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${PAYMENT_GRPC_PORT:-8081}:8081"
      - "${PAYMENT_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-message-handler:
    image: distributed-programming-payment:local
    command: [message-handler]
    environment:
      PAYMENT_MYSQL_ADDRESS: mysql:3306
      PAYMENT_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${PAYMENT_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      payment-service:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
